name: Update cask

# releases.parallelane.com 에 발행된 정식 버전 하나를 골라 Casks/parallelane.rb 의 version·sha256 을
# 갱신한다. 앱 저장소는 비공개지만 DMG는 공개 R2 에 있으므로 이 저장소만으로 완결된다.
# 트리거는 둘이다.
#   workflow_dispatch   — 수동. 로컬에서 `gh workflow run update-cask.yml -f version=1.3.0` 으로 실행한다.
#                         version 을 비우면 latest.json 을 따른다.
#   repository_dispatch — 앱 저장소 릴리스 워크플로가 즉시 알리고 싶을 때(선택, tap 쓰기 PAT 필요).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.3.0). Empty = version from latest.json'
        required: false
        type: string
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

env:
  RELEASE_BASE_URL: https://releases.parallelane.com
  CASK_PATH: Casks/parallelane.rb

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version="$(curl -fsSL "$RELEASE_BASE_URL/latest.json" | jq -r .version)"
            echo "resolved from latest.json: $version"
          fi
          # 정식 버전만 받는다. 프리릴리스(-beta.1 등)가 들어오면 정식 사용자에게 베타가 내려간다.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a stable release version: $version"
            exit 1
          fi
          current="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "$CASK_PATH")"
          echo "cask: $current, target: $version"
          if [ "$current" = "$version" ]; then
            echo "already at $version — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download DMG and compute sha256
        if: steps.version.outputs.changed == 'true'
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          url="$RELEASE_BASE_URL/$VERSION/ParalleLane-$VERSION.dmg"
          curl -fsSL "$url" -o ParalleLane.dmg
          sha="$(sha256sum ParalleLane.dmg | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$url → $sha"

      - name: Rewrite cask
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -euo pipefail
          sed -i -E "s|^(  version )\"[^\"]+\"|\1\"$VERSION\"|" "$CASK_PATH"
          sed -i -E "s|^(  sha256 )\"[^\"]+\"|\1\"$SHA256\"|" "$CASK_PATH"
          grep -q "version \"$VERSION\"" "$CASK_PATH"
          grep -q "sha256 \"$SHA256\"" "$CASK_PATH"
          git diff --stat

      - name: Commit and push
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "cask already at $VERSION — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"
          git commit -m "parallelane $VERSION"
          git push
